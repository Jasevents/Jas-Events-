<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>J.A.S EVENTS</title>
    
    <!-- إعدادات أمان إضافية -->
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <meta http-equiv="X-Frame-Options" content="DENY" />
    <meta http-equiv="Referrer-Policy" content="strict-origin-when-cross-origin" />
    <meta name="format-detection" content="telephone=no" />
    
    <style>
        /* إعادة تعيين */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background: #0a0a0a;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            margin: 0;
        }
        
        .card {
            max-width: 750px;
            width: 100%;
            background: #111111;
            border-radius: 50px;
            padding: 45px 35px;
            box-shadow: 0 30px 60px rgba(0,0,0,0.9), 0 0 0 2px #c9a84c, 0 0 50px rgba(201,168,76,0.08);
            text-align: center;
            border: 1px solid #c9a84c;
            position: relative;
            overflow: hidden;
            transition: transform 0.3s ease;
        }
        
        .card:hover {
            transform: scale(1.005);
        }
        
        /* الحدود الذهبية المتحركة (أنيقة وبسيطة) */
        .card::before {
            content: '';
            position: absolute;
            top: -2px;
            left: -2px;
            right: -2px;
            bottom: -2px;
            background: linear-gradient(45deg, #c9a84c, transparent, #c9a84c, transparent);
            background-size: 300% 300%;
            z-index: -1;
            border-radius: 52px;
            animation: goldBorder 8s ease infinite;
            opacity: 0.6;
        }
        
        @keyframes goldBorder {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        
        /* الشعار */
        .logo {
            font-size: 68px;
            font-weight: 900;
            letter-spacing: 8px;
            color: #c9a84c;
            text-shadow: 0 0 40px rgba(201,168,76,0.15);
            line-height: 1.1;
        }
        
        .logo span {
            font-size: 28px;
            letter-spacing: 3px;
            color: #e8e0d0;
            display: block;
            margin-top: 2px;
        }
        
        .tagline {
            font-size: 19px;
            font-weight: 300;
            letter-spacing: 5px;
            color: #c9a84c;
            margin: 18px 0 6px;
            text-transform: uppercase;
            border-top: 1px solid rgba(201,168,76,0.25);
            border-bottom: 1px solid rgba(201,168,76,0.25);
            padding: 10px 0;
            display: inline-block;
        }
        
        .location {
            font-size: 16px;
            color: #c9a84c;
            margin: 8px 0 28px;
            letter-spacing: 1px;
            background: rgba(201,168,76,0.05);
            padding: 6px 24px;
            border-radius: 60px;
            display: inline-block;
            border: 1px solid rgba(201,168,76,0.12);
        }
        
        /* الأزرار */
        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
            margin: 10px 0 8px;
        }
        
        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            padding: 18px 12px;
            border-radius: 60px;
            font-size: 17px;
            font-weight: 600;
            text-decoration: none;
            color: #fff;
            background: #161616;
            border: 1px solid #2a2a2a;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }
        
        .btn::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            background: rgba(255,255,255,0.05);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            transition: width 0.6s, height 0.6s;
        }
        
        .btn:active::after {
            width: 300px;
            height: 300px;
        }
        
        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 30px rgba(0,0,0,0.6);
        }
        
        .btn i { font-size: 22px; width: 28px; text-align: center; }
        
        /* ألوان الأزرار (هادية وأنيقة) */
        .btn-whatsapp { border-color: #25d366; color: #25d366; }
        .btn-whatsapp:hover { background: #25d366; color: #fff; }
        
        .btn-instagram { border-color: #d6249f; color: #d6249f; }
        .btn-instagram:hover { background: #d6249f; color: #fff; }
        
        .btn-facebook { border-color: #1877f2; color: #1877f2; }
        .btn-facebook:hover { background: #1877f2; color: #fff; }
        
        .btn-email { border-color: #ea4335; color: #ea4335; }
        .btn-email:hover { background: #ea4335; color: #fff; }
        
        .btn-call { border-color: #34a853; color: #34a853; }
        .btn-call:hover { background: #34a853; color: #fff; }
        
        .btn-location { border-color: #c9a84c; color: #c9a84c; }
        .btn-location:hover { background: #c9a84c; color: #0a0a0a; }
        
        /* QR Code */
        .qr-section {
            margin: 28px 0 14px;
            padding: 18px;
            border-top: 1px solid rgba(201,168,76,0.12);
            border-bottom: 1px solid rgba(201,168,76,0.12);
        }
        
        .qr-section img {
            width: 130px;
            height: 130px;
            border-radius: 16px;
            border: 2px solid #c9a84c;
            padding: 6px;
            background: #fff;
        }
        
        .qr-label {
            color: #888;
            font-size: 13px;
            letter-spacing: 2px;
            margin-top: 6px;
        }
        
        .qr-label strong { color: #c9a84c; }
        
        /* footer */
        .footer {
            margin-top: 24px;
            font-size: 14px;
            color: #666;
            letter-spacing: 1px;
            padding-top: 18px;
        }
        
        .footer strong { color: #c9a84c; font-weight: 500; }
        .footer small { display: block; font-size: 11px; color: #444; margin-top: 4px; }
        
        /* تنسيق للجوال */
        @media (max-width: 500px) {
            .card { padding: 28px 16px; }
            .logo { font-size: 44px; letter-spacing: 4px; }
            .logo span { font-size: 20px; }
            .tagline { font-size: 15px; letter-spacing: 3px; padding: 8px 0; }
            .grid { grid-template-columns: 1fr; gap: 10px; }
            .btn { padding: 14px 10px; font-size: 15px; }
            .qr-section img { width: 100px; height: 100px; }
        }
    </style>
</head>
<body>
    <div class="card">
        <!-- الشعار -->
        <div class="logo">J.A.S <span>EVENTS</span></div>
        <div class="tagline">WE PLAN, YOU ENJOY</div>
        <div class="location">📍 Hurghada, Red Sea</div>
        
        <!-- الأزرار -->
        <div class="grid">
            <a href="https://wa.me/201114974162" target="_blank" rel="noopener noreferrer" class="btn btn-whatsapp"><i>📱</i> WhatsApp</a>
            <a href="https://www.instagram.com/jasevents.0" target="_blank" rel="noopener noreferrer" class="btn btn-instagram"><i>📸</i> Instagram</a>
            <a href="https://www.facebook.com/share/1JnBz7pn9o/" target="_blank" rel="noopener noreferrer" class="btn btn-facebook"><i>👍</i> Facebook</a>
            <a href="mailto:jasevents2026@gmail.com" class="btn btn-email"><i>✉</i> Email</a>
            <a href="tel:+201114974162" class="btn btn-call"><i>📞</i> Call Now</a>
            <a href="https://maps.google.com/?q=Hurghada+Red+Sea" target="_blank" rel="noopener noreferrer" class="btn btn-location"><i>📍</i> Location</a>
        </div>
        
        <!-- QR Code -->
        <div class="qr-section">
            <img src="https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=https://jasevents.github.io/Jas-Events/" alt="QR Code" />
            <div class="qr-label"><strong>📲 J.A.S EVENTS</strong> — امسح و تواصل</div>
        </div>
        
        <!-- التذييل -->
        <div class="footer">
            <strong>Serving Moments, Creating Memories</strong>
            <small>J.A.S EVENTS © 2026</small>
        </div>
    </div>
</body>
</html>
