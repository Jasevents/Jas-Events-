<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>J.A.S EVENTS</title>
    
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <meta http-equiv="X-Frame-Options" content="DENY" />
    <meta http-equiv="Referrer-Policy" content="strict-origin-when-cross-origin" />
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background: #0a0a0a;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .card {
            max-width: 420px;
            width: 100%;
            background: #111111;
            border-radius: 28px;
            padding: 40px 28px 35px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.95), 0 0 0 1px rgba(184,148,42,0.3);
            text-align: center;
            border: 1px solid rgba(184,148,42,0.15);
            position: relative;
        }
        
        .logo-img {
            width: 160px;
            height: 160px;
            object-fit: contain;
            margin: 0 auto 6px;
            display: block;
            filter: drop-shadow(0 4px 20px rgba(184,148,42,0.2));
        }
        
        .logo-text {
            font-size: 20px;
            font-weight: 400;
            letter-spacing: 6px;
            color: #b8942a;
            margin-bottom: 10px;
        }
        
        .tagline {
            font-size: 14px;
            font-weight: 400;
            letter-spacing: 4px;
            color: #b8942a;
            margin-bottom: 18px;
            text-transform: uppercase;
        }
        
        .divider {
            width: 50px;
            height: 1px;
            background: rgba(184,148,42,0.4);
            margin: 0 auto 18px;
        }
        
        .location {
            font-size: 15px;
            color: #b8942a;
            margin-bottom: 28px;
            letter-spacing: 1px;
        }
        
        .btn-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 28px;
        }
        
        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 16px 10px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 500;
            text-decoration: none;
            color: #e8e0d0;
            background: #1a1a1a;
            border: 1px solid rgba(184,148,42,0.25);
            transition: all 0.3s ease;
        }
        
        .btn:hover {
            background: #222222;
            border-color: rgba(184,148,42,0.5);
            transform: translateY(-2px);
        }
        
        .btn i, .btn .icon-fb { 
            font-size: 20px; 
            width: 26px; 
            text-align: center; 
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }
        
        .btn-whatsapp i { color: #25d366; }
        .btn-instagram i { color: #d6249f; }
        .btn-facebook .icon-fb { color: #1877f2; font-weight: 700; font-size: 18px; }
        .btn-email i { color: #ea4335; }
        .btn-call i { color: #34a853; }
        
        .slogan {
            font-size: 15px;
            color: #666;
            font-style: italic;
            letter-spacing: 1px;
        }
        
        @media (max-width: 500px) {
            .card { padding: 30px 20px 28px; }
            .logo-img { width: 130px; height: 130px; }
            .logo-text { font-size: 17px; letter-spacing: 4px; }
            .tagline { font-size: 12px; letter-spacing: 3px; }
            .btn { padding: 14px 10px; font-size: 15px; }
        }
    </style>
</head>
<body>
    <div class="card">
        <img src="1000451625.png" alt="JAS Logo" class="logo-img" />
        
        <div class="logo-text">J . A . S &nbsp; E V E N T S</div>
        <div class="tagline">WE PLAN, YOU ENJOY</div>
        
        <div class="divider"></div>
        
        <div class="location">📍 Hurghada, Red Sea</div>
        
        <div class="btn-list">
            <a href="https://wa.me/201114974162" target="_blank" rel="noopener noreferrer" class="btn btn-whatsapp"><i>💬</i> WhatsApp</a>
            <a href="https://www.instagram.com/jasevents.0" target="_blank" rel="noopener noreferrer" class="btn btn-instagram"><i>📷</i> Instagram</a>
            <a href="https://www.facebook.com/share/1JnBz7pn9o/" target="_blank" rel="noopener noreferrer" class="btn btn-facebook"><span class="icon-fb">f</span> Facebook</a>
            <a href="mailto:jasevents2026@gmail.com" class="btn btn-email"><i>✉️</i> Email</a>
            <a href="tel:+201114974162" class="btn btn-call"><i>📞</i> Call Now</a>
        </div>
        
        <div class="slogan">Serving Moments, Creating Memories</div>
    </div>
</body>
</html>
